services:
  mariadb:
    image: mariadb:11
    container_name: cv-mariadb
    command: --max_allowed_packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: cvmanager
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # Local LLM powering the CV AI agent (backend "ai" module + MCP server).
  # Model is configurable via the OLLAMA_MODEL environment variable.
  ollama:
    image: ollama/ollama:latest
    container_name: cv-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull "$$OLLAMA_MODEL"
        wait
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mariadb_data:
  ollama_data:
